# Auto-merged on top of docker-compose.yml by plain `docker compose ...`
# (and by `./start.sh --dev`) — this is the local development stack: Vite
# dev server for the frontend, uvicorn auto-reload for the backend.
#
# `./start.sh` with no flags runs the production-shaped stack instead
# (docker-compose.yml + docker-compose.prod.yml) — see docker-compose.prod.yml.
services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
      - "${FRONTEND_PORT:-3000}:5173"
    command: npm run dev -- --host
