services:
  backend:
    volumes:
      - sqlite_data:/data
      - ${LOCAL_DOCS_PATH:-./sample-docs}:/host-docs:ro
    environment:
      - HOST_DOCS_ROOT=/host-docs
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: npm run dev -- --host
