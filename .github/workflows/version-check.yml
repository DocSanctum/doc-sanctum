name: Version Check

# Runs on every PR and when labels change, so adding skip-version re-runs it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version Bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-version') }}
        run: |
          args=("origin/$BASE_REF")
          if [ "$SKIP" = "true" ]; then args+=(--skip-bump); fi
          python3 scripts/check_version.py "${args[@]}"
