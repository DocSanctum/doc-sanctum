name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_PAT }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/DocSanctum/.github/blob/main/CLA.md'
          branch: 'main'
          remote-organization-name: 'DocSanctum'
          remote-repository-name: 'cla-signatures'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before this can be merged, please sign our
            [Contributor License Agreement](https://github.com/DocSanctum/.github/blob/main/CLA.md).

            Comment on this pull request with the exact text:

            > I have read the CLA Document and I hereby sign the CLA

            Contributing on behalf of a company? See the
            [Corporate CLA](https://github.com/DocSanctum/.github/blob/main/CLA.md#corporate-contributor-license-agreement)
            instructions instead — it can't be signed via comment.
          custom-allsigned-prcomment: 'All contributors have signed the CLA. :white_check_mark:'
