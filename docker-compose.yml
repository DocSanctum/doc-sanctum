# --- Scaleout deployment ----------------------------------------------------
# The default setup below is `standalone`: one backend replica, local +
# remote sources both allowed. Both `standalone` and `scaleout` now share
# the same persistent `vectorstore` service — a restart no longer re-embeds
# every document from scratch. To run multiple backend replicas sharing
# that index instead:
#   1. `vectorstore` is already running (this compose file always starts it).
#   2. Launch backend with DEPLOYMENT_MODE=scaleout, e.g.:
#        DEPLOYMENT_MODE=scaleout docker compose up -d --scale backend=2
#   3. Local filesystem sources are rejected in this mode — backend replicas
#      don't have access to the operator's machine, only to remote
#      GitHub/HTTP sources. Registering one returns 422.
#   4. `vectorstore_data` persists the shared index across restarts/redeploys
#      of any replica — do not delete it unless you intend to lose the index.
#   5. `BACKEND_PORT` is now a host port *range* (default 8000-8009), because
#      a fixed single port can't be published by more than one replica —
#      `--scale backend=2` fails outright otherwise ("port is already
#      allocated"). Each replica binds the next free port in the range, so
#      with 2 replicas up you'll see them on 8000 and 8001, including their
#      MCP endpoints (`:8000/mcp`, `:8001/mcp`, ...) — the MCP address is NOT
#      the same across replicas when accessed directly.
#   6. Put a load balancer in front with least-connections (or similar
#      load-aware) routing if you can — plain round-robin will keep sending
#      requests to a replica that's mid-embedding a large re-index. Point
#      MCP clients (and anything else that needs one stable address) at the
#      LB, not at an individual replica's port from the range above.
# -----------------------------------------------------------------------------
services:
  vectorstore:
    image: chromadb/chroma:latest
    ports:
      - "${VECTOR_STORE_HOST_PORT:-8001}:8000"  # host-facing port, for local inspection only
    volumes:
      # chromadb/chroma persists to /data by default (see its startup log:
      # "Saving data to: /data") — the container's own /chroma/chroma path is
      # never written to, so mounting the named volume there silently drops
      # every embedding on the next container recreate (image update, host
      # reboot, `docker compose up --build`) while doc_index_cache (a
      # separate, correctly-mounted SQLite volume) still reports every
      # document as already indexed, so nothing re-embeds automatically.
      - vectorstore_data:/data
    restart: unless-stopped
    healthcheck:
      # The image only ships bash (no curl/wget/python), so this checks the
      # port accepts a connection rather than hitting a specific HTTP route.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        HOME: ${HOME}
    ports:
      - "${BACKEND_PORT:-8000}-${BACKEND_PORT_MAX:-8009}:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/db.sqlite3
      - DEFAULT_POLL_INTERVAL=${DEFAULT_POLL_INTERVAL:-300}
      - HOME=${HOME}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-standalone}  # standalone | scaleout
      - VECTOR_STORE_HOST=${VECTOR_STORE_HOST:-vectorstore}  # both modes now use the persistent vectorstore service
      - VECTOR_STORE_PORT=8000                                # vectorstore's in-network port
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    volumes:
      - sqlite_data:/data
      - ${HOME}:${HOME}:ro
      # Writable overlay on top of the read-only HOME mount above: the
      # embedding model chromadb bakes into the image during build lives at
      # this same path (Path.home()/.cache/chroma — see backend/Dockerfile),
      # so Docker auto-populates this named volume from the image on first
      # run instead of trying to write into the read-only host HOME mount.
      # Requires $HOME/.cache/chroma to already exist on the host — Docker
      # can't create a mountpoint under an already read-only bind, so
      # start.sh pre-creates it with `mkdir -p`. Running `docker compose`
      # directly instead of start.sh needs the same `mkdir -p` done first.
      - embedding_model_cache:${HOME}/.cache/chroma
    restart: unless-stopped
    depends_on:
      vectorstore:
        condition: service_healthy
    healthcheck:
      # /api/v1/deployment is a trivial, dependency-free route (just echoes
      # the configured mode) — enough to confirm the ASGI app is up and
      # routing without exercising the database or vector store.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/deployment', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # frontend build target/ports/command are dev/prod-specific — see
  # docker-compose.override.yml (dev, auto-merged) and docker-compose.prod.yml
  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  vectorstore_data:
  embedding_model_cache:
