# --- Scaleout deployment (specs/004-scaleout-deployment) -------------------
# The default setup below is `standalone`: one backend, one in-memory vector
# index, local + remote sources both allowed. To run multiple backend
# replicas sharing one persistent vector index instead:
#   1. Start `vectorstore` (this compose file already does, it's cheap idle).
#   2. Launch backend with DEPLOYMENT_MODE=scaleout, e.g.:
#        DEPLOYMENT_MODE=scaleout docker compose up -d --scale backend=2
#   3. Local filesystem sources are rejected in this mode (FR-004) — backend
#      replicas don't have access to the operator's machine, only to remote
#      GitHub/HTTP sources. Registering one returns 422.
#   4. `vectorstore_data` persists the shared index across restarts/redeploys
#      of any replica — do not delete it unless you intend to lose the index.
#   5. `BACKEND_PORT` is now a host port *range* (default 8000-8009), because
#      a fixed single port can't be published by more than one replica —
#      `--scale backend=2` fails outright otherwise ("port is already
#      allocated"). Each replica binds the next free port in the range, so
#      with 2 replicas up you'll see them on 8000 and 8001, including their
#      MCP endpoints (`:8000/mcp`, `:8001/mcp`, ...) — the MCP address is NOT
#      the same across replicas when accessed directly.
#   6. Put a load balancer in front with least-connections (or similar
#      load-aware) routing if you can — plain round-robin will keep sending
#      requests to a replica that's mid-embedding a large re-index (see
#      specs/004-scaleout-deployment/quickstart.md "운영 참고"). Point MCP
#      clients (and anything else that needs one stable address) at the LB,
#      not at an individual replica's port from the range above.
# -----------------------------------------------------------------------------
services:
  vectorstore:
    image: chromadb/chroma:latest
    ports:
      - "${VECTOR_STORE_HOST_PORT:-8001}:8000"  # host-facing port, for local inspection only
    volumes:
      - vectorstore_data:/chroma/chroma
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        HOME: ${HOME}
    ports:
      - "${BACKEND_PORT:-8000}-${BACKEND_PORT_MAX:-8009}:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/db.sqlite3
      - DEFAULT_POLL_INTERVAL=${DEFAULT_POLL_INTERVAL:-300}
      - HOME=${HOME}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-standalone}  # standalone | scaleout
      - VECTOR_STORE_HOST=${VECTOR_STORE_HOST:-vectorstore}  # only read when scaleout
      - VECTOR_STORE_PORT=8000                                # vectorstore's in-network port
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    volumes:
      - sqlite_data:/data
      - ${HOME}:${HOME}:ro
      # Writable overlay on top of the read-only HOME mount above: the
      # embedding model chromadb bakes into the image during build lives at
      # this same path (Path.home()/.cache/chroma — see backend/Dockerfile),
      # so Docker auto-populates this named volume from the image on first
      # run instead of trying to write into the read-only host HOME mount.
      - embedding_model_cache:${HOME}/.cache/chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "5173:5173"
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host
    restart: unless-stopped

volumes:
  sqlite_data:
  vectorstore_data:
  embedding_model_cache:
