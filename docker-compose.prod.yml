# Production-shaped stack: nginx serves the prebuilt/minified frontend and
# reverse-proxies /api and /sse to the backend (see frontend/nginx.conf), and
# the backend runs without the dev auto-reload watcher.
#
# This is the default stack `./start.sh` runs (merged on top of
# docker-compose.yml). For local development instead, run `./start.sh --dev`,
# which uses docker-compose.override.yml in place of this file.
#
# Also layers on production-only hardening that dev doesn't need: capped,
# rotated logs (dev logs are short-lived and actively tailed) and a memory/
# CPU ceiling on the backend (embedding/indexing is CPU-heavy — this stops
# one runaway job from starving the host or the other containers).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2}"
          memory: ${BACKEND_MEMORY_LIMIT:-2g}

  frontend:
    build:
      target: prod
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    logging: *default-logging
    healthcheck:
      # 127.0.0.1, not localhost: musl (alpine) resolves localhost to ::1
      # first, but nginx only listens on IPv4, so wget would hit
      # "Connection refused" trying the v6 loopback.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vectorstore:
    logging: *default-logging
